name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  rust:
    name: Rust (clippy, tests)
    # Windows runners cost double on private repos: run for pull requests, and on main so the build
    # cache exists there (branches can only restore caches from the default branch).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the built frontend, so it has to exist.
      - run: npm ci
      - run: npx vite build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # Network speakers live in their own crate; `cargo test` above covers only the app.
      - run: cargo clippy -p musify-cast --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test -p musify-cast
        working-directory: src-tauri
