[workspace]
members = ["crates/navify-audio"]

[package]
name = "navify"
version = "0.1.0"
description = "Navify – a fast, lightweight desktop music player for Navidrome, Subsonic and Jellyfin"
authors = ["Navify contributors"]
repository = "https://github.com/Bulma1337/navify"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "navify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["dangerous-settings", "gzip", "brotli", "socks"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = "4"
navify-audio = { path = "crates/navify-audio" }
crossbeam-channel = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Audio DSP must stay fast even in debug builds, otherwise dev playback glitches.
[profile.dev.package."*"]
opt-level = 2

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
