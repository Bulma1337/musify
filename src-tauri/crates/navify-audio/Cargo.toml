[package]
name = "navify-audio"
version = "0.1.0"
edition = "2024"
description = "Navify's native audio engine: streaming decode, true gapless, crossfade, f64 DSP/EQ, bit-perfect output"
repository = "https://github.com/Bulma1337/navify"
publish = false

[features]
default = ["opus"]
# Opus decoding via libopus (built with CMake). Without it, Opus streams must be transcoded by the server.
opus = ["dep:symphonia-adapter-libopus"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "opt-simd",
] }
symphonia-adapter-libopus = { version = "0.3", optional = true }
cpal = "0.18"
rubato = "5"
rtrb = "0.4"
realfft = "3.5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
log = "0.4"
sha2 = "0.11"
# Same TLS stack as the app (rustls + ring), blocking client on dedicated download threads.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
assert_no_alloc = "1.1"
tempfile = "3"
